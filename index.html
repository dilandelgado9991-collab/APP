<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Académica</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            flex: 1;
        }

        .form-group {
            display: grid;
            grid-template-columns: 2fr 3fr 1.5fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, select, button {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #f8f9fa;
            color: #2c3e50;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .Pendiente { background-color: #ffeaa7; color: #d63031; }
        .Completada { background-color: #55efc4; color: #00b894; }

        .btn-action {
            padding: 5px 10px;
            font-size: 12px;
            margin-right: 5px;
        }

        .btn-check { background-color: #2ecc71; }
        .btn-check:hover { background-color: #27ae60; }

        .btn-delete { background-color: #e74c3c; }
        .btn-delete:hover { background-color: #c0392b; }

        .summary {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>📋 Sistema de Gestión Académica</h1>
    </header>

    <div class="container">
        <h2>Agregar Registro</h2>
        <br>
        <form id="taskForm" class="form-group">
            <input type="text" id="materia" placeholder="Materia / Asignatura" required>
            <input type="text" id="descripcion" placeholder="Descripción de la tarea" required>
            <select id="prioridad">
                <option value="Alta">Prioridad Alta</option>
                <option value="Media" selected>Prioridad Media</option>
                <option value="Baja">Prioridad Baja</option>
            </select>
            <button type="submit">Guardar</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Materia</th>
                    <th>Descripción</th>
                    <th>Prioridad</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaTareas">
                <!-- Se puebla dinámicamente -->
            </tbody>
        </table>

        <div class="summary">
            <span>Total de Pendientes: <span id="cantPendientes">0</span></span>
            <span>Total de Completadas: <span id="cantCompletadas">0</span></span>
        </div>
    </div>

    <script>
        let tareas = [];

        const taskForm = document.getElementById('taskForm');
        const tablaTareas = document.getElementById('tablaTareas');
        const cantPendientes = document.getElementById('cantPendientes');
        const cantCompletadas = document.getElementById('cantCompletadas');

        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const materia = document.getElementById('materia').value.trim();
            const descripcion = document.getElementById('descripcion').value.trim();
            const prioridad = document.getElementById('prioridad').value;

            if (!materia || !descripcion) return;

            const nuevaTarea = {
                id: Date.now(),
                materia,
                descripcion,
                prioridad,
                estado: 'Pendiente'
            };

            tareas.push(nuevaTarea);
            taskForm.reset();
            render();
        });

        function cambiarEstado(id) {
            tareas = tareas.map(t => t.id === id ? { ...t, estado: t.estado === 'Pendiente' ? 'Completada' : 'Pendiente' } : t);
            render();
        }

        function eliminarTarea(id) {
            tareas = tareas.filter(t => t.id !== id);
            render();
        }

        function render() {
            tablaTareas.innerHTML = '';

            tareas.forEach((t, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${t.materia}</strong></td>
                    <td>${t.descripcion}</td>
                    <td>${t.prioridad}</td>
                    <td><span class="badge ${t.estado}">${t.estado}</span></td>
                    <td>
                        <button class="btn-action btn-check" onclick="cambiarEstado(${t.id})">✓</button>
                        <button class="btn-action btn-delete" onclick="eliminarTarea(${t.id})">✕</button>
                    </td>
                `;
                tablaTareas.appendChild(tr);
            });

            const pendientes = tareas.filter(t => t.estado === 'Pendiente').length;
            const completadas = tareas.filter(t => t.estado === 'Completada').length;

            cantPendientes.textContent = pendientes;
            cantCompletadas.textContent = completadas;
        }
    </script>
</body>
</html>
